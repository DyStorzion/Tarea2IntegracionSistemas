name: cowork

# Solo Kong publica puerto hacia afuera (D-24). Todo lo demás vive en la red interna.
# Prometheus y Grafana (D-27) se publican solo en 127.0.0.1, como herramientas de evidencia.

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [interna]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-servicio: &servicio
  restart: unless-stopped
  networks: [interna]

services:
  # ---------- Punto de entrada ----------
  kong:
    image: kong:3.9
    restart: unless-stopped
    networks: [interna]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"          # sin Admin API: la config es solo el archivo
      KONG_STATUS_LISTEN: 0.0.0.0:8100  # /metrics para Prometheus; solo red interna (sin ports)
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Caché DNS corta. Sin esto Kong sigue usando la IP vieja de un contenedor
      # recreado y puede enrutar al contenedor equivocado.
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "0"
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - reservas
      - espacios
      - bff-web

  # ---------- Servicios propios (sin ports: red interna) ----------
  bff-web:
    <<: *servicio
    build: ./services/bff-web
    environment:
      RESERVAS_URL: http://reservas:8000
      ESPACIOS_URL: http://espacios:8000
      PAGOS_URL: http://pagos:8000
      ACCESO_URL: http://acceso:8000
      # Mismos plazos que reservas (D-40); misma variable en el .env cambia ambos servicios
      TIMEOUT_CONEXION_S: ${TIMEOUT_CONEXION_S:-0.5}
      TIMEOUT_ESPACIOS_S: ${TIMEOUT_ESPACIOS_S:-1}
      TIMEOUT_PAGOS_S: ${TIMEOUT_PAGOS_S:-2}
      TIMEOUT_ACCESO_S: ${TIMEOUT_ACCESO_S:-1.5}

  reservas:
    <<: *servicio
    build: ./services/reservas
    environment:
      DATABASE_URL: postgresql://reservas:${POSTGRES_PASSWORD:-cowork}@db-reservas:5432/reservas
      ESPACIOS_URL: http://espacios:8000
      PAGOS_URL: http://pagos:8000
      ACCESO_URL: http://acceso:8000
      RESILIENCE_ENABLED: ${RESILIENCE_ENABLED:-true}
      # D-48: parámetros de resiliencia con los valores acordados en DECISIONES.md (sección 10).
      # reservas/app/config.py debe leer exactamente estos nombres.
      TIMEOUT_CONEXION_S: ${TIMEOUT_CONEXION_S:-0.5}
      TIMEOUT_ESPACIOS_S: ${TIMEOUT_ESPACIOS_S:-1}
      TIMEOUT_PAGOS_S: ${TIMEOUT_PAGOS_S:-2}
      TIMEOUT_ACCESO_S: ${TIMEOUT_ACCESO_S:-1.5}
      TIMEOUT_COMPENSACION_S: ${TIMEOUT_COMPENSACION_S:-5}
      RETRY_PASOS_INTENTOS: ${RETRY_PASOS_INTENTOS:-2}
      RETRY_COMPENSACION_INTENTOS: ${RETRY_COMPENSACION_INTENTOS:-3}
      RETRY_COMPENSACION_ESPERA_S: ${RETRY_COMPENSACION_ESPERA_S:-0.2}   # la segunda espera es el doble
      CB_VENTANA: ${CB_VENTANA:-10}
      CB_MINIMO_LLAMADAS: ${CB_MINIMO_LLAMADAS:-5}
      CB_UMBRAL_FALLOS: ${CB_UMBRAL_FALLOS:-0.5}
      CB_ESPERA_ABIERTO_S: ${CB_ESPERA_ABIERTO_S:-10}
      BULKHEAD_ACCESO_CUPOS: ${BULKHEAD_ACCESO_CUPOS:-5}
      POOL_CONEXIONES: ${POOL_CONEXIONES:-20}
    depends_on:
      db-reservas:
        condition: service_healthy

  espacios:
    <<: *servicio
    build: ./services/espacios
    environment:
      DATABASE_URL: postgresql://espacios:${POSTGRES_PASSWORD:-cowork}@db-espacios:5432/espacios
    depends_on:
      db-espacios:
        condition: service_healthy

  pagos:
    <<: *servicio
    build: ./services/pagos
    environment:
      DATABASE_URL: postgresql://pagos:${POSTGRES_PASSWORD:-cowork}@db-pagos:5432/pagos
    depends_on:
      db-pagos:
        condition: service_healthy

  acceso:
    <<: *servicio
    build: ./services/acceso
    environment:
      DATABASE_URL: postgresql://acceso:${POSTGRES_PASSWORD:-cowork}@db-acceso:5432/acceso
    depends_on:
      db-acceso:
        condition: service_healthy

  # ---------- Una base por servicio (D-11) ----------
  db-reservas:
    <<: *postgres
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowork}
      POSTGRES_DB: reservas
    volumes: [db-reservas-data:/var/lib/postgresql/data]

  db-espacios:
    <<: *postgres
    environment:
      POSTGRES_USER: espacios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowork}
      POSTGRES_DB: espacios
    volumes: [db-espacios-data:/var/lib/postgresql/data]

  db-pagos:
    <<: *postgres
    environment:
      POSTGRES_USER: pagos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowork}
      POSTGRES_DB: pagos
    volumes: [db-pagos-data:/var/lib/postgresql/data]

  db-acceso:
    <<: *postgres
    environment:
      POSTGRES_USER: acceso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowork}
      POSTGRES_DB: acceso
    volumes: [db-acceso-data:/var/lib/postgresql/data]

  # ---------- Observabilidad (D-27): solo 127.0.0.1 ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [interna]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    networks: [interna]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # ---------- Pruebas de carga ----------
  # No arranca con "up". Uso: docker compose run --rm k6 run /scripts/smoke.js
  k6:
    image: grafana/k6:0.55.0
    profiles: ["carga"]
    networks: [interna]
    environment:
      BASE_URL: http://kong:8000
    volumes:
      - ./k6:/scripts:ro
      - ./k6/resultados:/resultados   # resumen de cada corrida de los escenarios de falla

networks:
  interna: {}

volumes:
  db-reservas-data:
  db-espacios-data:
  db-pagos-data:
  db-acceso-data:
