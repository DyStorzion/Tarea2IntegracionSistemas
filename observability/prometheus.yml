global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Kong: plugin prometheus expuesto en el status listener (KONG_STATUS_LISTEN :8100)
  - job_name: gateway
    static_configs:
      - targets: ["kong:8100"]

  # Servicios FastAPI: prometheus_client montado en /metrics/
  - job_name: servicios
    metrics_path: /metrics/
    static_configs:
      - targets:
          - reservas:8000
          - espacios:8000
          - pagos:8000
          - acceso:8000
          - bff-web:8000
