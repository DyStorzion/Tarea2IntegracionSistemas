# Kong DB-less (D-03). El gateway no tiene lógica de negocio: solo enruta, autentica, limita y etiqueta peticiones.
_format_version: "3.0"
_transform: true

services:
  - name: reservas
    url: http://reservas:8000
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 0                # nunca reintentar un POST en el gateway (idempotencia: D-13)
    routes:
      - name: reservas-api
        paths: [/reservas]
        strip_path: false     # el cliente llama /reservas/... y el servicio ve /reservas/...

  - name: bff-web
    url: http://bff-web:8000
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 0
    routes:
      - name: bff-web-api
        paths: [/mis-reservas]
        strip_path: false

# Cliente identificado por el claim `iss` del JWT (plugin jwt, key_claim_name: iss).
# DEV: secreto en el repo. En producción iría en un vault; para el encargo basta
# con que coincida con JWT_SECRET de scripts/generar_token.py.
consumers:
  - username: cliente-demo
    jwt_secrets:
      - key: cliente-demo
        algorithm: HS256
        secret: cowork-dev-secret-hs256-0123456789abcdef

plugins:
  # D-28: UUID por petición, enviado a los servicios y devuelto al cliente
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # D-04: autenticación central. Los servicios internos confían en que la
  # petición ya pasó por aquí (Kong agrega X-Consumer-Username).
  - name: jwt
    config:
      key_claim_name: iss
      claims_to_verify: [exp]
