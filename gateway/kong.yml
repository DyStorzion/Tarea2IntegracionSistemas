# Configuración declarativa de Kong (modo DB-less).
# El gateway SOLO enruta, autentica y limita: no contiene lógica de negocio.
#
# Secretos JWT: valores de DESARROLLO, solo para la demo académica.
# Para generar un token: python scripts/generar_token.py cliente-1

_format_version: "3.0"
_transform: true

services:
  # Orquestador de la Saga
  - name: reservas
    url: http://reservas:8000/reservas
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    routes:
      - name: reservas
        paths: ["/api/reservas"]
        strip_path: true

  # Consulta de espacios y disponibilidad
  - name: espacios
    url: http://espacios:8000/espacios
    connect_timeout: 2000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: espacios
        paths: ["/api/espacios"]
        strip_path: true
        methods: ["GET"]

  # BFF Web (agregación por cliente)
  - name: bff-web
    url: http://bff-web:8000
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: bff-web
        paths: ["/bff/web"]
        strip_path: true

consumers:
  - username: cliente-1
    jwt_secrets:
      - key: cliente-1
        algorithm: HS256
        secret: dev-secreto-cliente-1-cambiar
  - username: cliente-2
    jwt_secrets:
      - key: cliente-2
        algorithm: HS256
        secret: dev-secreto-cliente-2-cambiar

plugins:
  # Autenticación central: el claim "iss" identifica al consumidor; se exige "exp".
  - name: jwt
    config:
      key_claim_name: iss
      claims_to_verify: ["exp"]

  # Rate limiting por consumidor. Valores provisorios.
  - name: rate-limiting
    config:
      second: 10
      minute: 300
      limit_by: consumer
      policy: local

  # Identificador de petición propagado a los servicios (X-Request-ID) para seguirla en los logs.
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Métricas del gateway (peticiones por código de estado, 429 del rate limiting, latencia).
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
